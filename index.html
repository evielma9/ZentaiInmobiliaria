<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentai Servicios Inmobiliarios</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            zentai: {
              blue: '#1D3D4E',
              gold: '#9E9275',
              'gold-light': '#C4B99D',
              dark: '#122631',
              bg: '#F8F9FA'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Propiedades iniciales locales
    const initialProperties = [
      {
        id: 'ZEN-2026-001',
        controlNumber: 'ZEN-2026-001',
        title: 'Casa Moderna en Residencia Los Olivos',
        type: 'venta',
        status: 'active', // 'active' (Publicado) u 'inactive' (Oculto)
        price: 2850000,
        city: 'San Luis Río Colorado',
        colonia: 'Burócratas',
        landArea: 200,
        builtArea: 160,
        roomsCount: 3,
        roomDetails: [
          'Recámara principal con baño completo y vestidor',
          '2 Recámaras secundarias con clóset',
          'Sala / Comedor de concepto abierto',
          'Cocina integral con barra de granito',
          '2.5 Baños en total',
          'Cochera para 2 autos'
        ],
        infonavit: true,
        credits: ['Infonavit', 'Bancario', 'Cofinavit', 'Contado'],
        rentTerms: {
          depositMonths: '',
          guarantorRequired: false,
          incomeProof: false,
          petsAllowed: false,
          includedUtilities: '',
          minContractMonths: '12'
        },
        ownerName: 'Carlos Mendoza Valencia',
        ownerPhone: '653-123-4567',
        ownerEmail: 'carlos.mendoza@email.com',
        privateNotes: 'Comisión acordada del 5%. Escrituras al corriente en Notaría 3.',
        adminComments: 'Revisado por administración. Papelería en regla.',
        photos: [
          'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    function App() {
      const [authMode, setAuthMode] = useState('public');
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [targetRole, setTargetRole] = useState('');

      // Cargar propiedades desde localStorage
      const [properties, setProperties] = useState(() => {
        const saved = localStorage.getItem('zentai_properties_local');
        return saved ? JSON.parse(saved) : initialProperties;
      });

      // Guardar cambios automáticamente en localStorage
      useEffect(() => {
        localStorage.setItem('zentai_properties_local', JSON.stringify(properties));
      }, [properties]);

      const [selectedProperty, setSelectedProperty] = useState(null);
      const [activePhotoIdx, setActivePhotoIdx] = useState(0);
      const [copySuccess, setCopySuccess] = useState(false);

      const [activeTab, setActiveTab] = useState('venta');
      const [filterSearch, setFilterSearch] = useState('');
      const [filterCity, setFilterCity] = useState('all');
      const [filterColonia, setFilterColonia] = useState('all');
      const [filterInfonavit, setFilterInfonavit] = useState('all');

      const [showNewModal, setShowNewModal] = useState(false);
      const [editingProperty, setEditingProperty] = useState(null);

      // Detección de Hash en URL (Deep Linking)
      useEffect(() => {
        const checkHash = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#/inmueble/')) {
            const ctrlNum = hash.replace('#/inmueble/', '');
            const found = properties.find(p => p.controlNumber === ctrlNum || p.id === ctrlNum);
            if (found && (authMode === 'admin' || found.status !== 'inactive')) {
              setSelectedProperty(found);
              setActiveTab(found.type || 'venta');
              setActivePhotoIdx(0);
            }
          }
        };

        checkHash();
        window.addEventListener('hashchange', checkHash);
        return () => window.removeEventListener('hashchange', checkHash);
      }, [properties, authMode]);

      const [formData, setFormData] = useState({
        controlNumber: '',
        title: '',
        type: 'venta',
        status: 'active',
        price: '',
        city: 'San Luis Río Colorado',
        colonia: '',
        landArea: '',
        builtArea: '',
        roomsCount: '',
        roomDetails: '',
        infonavit: true,
        credits: ['Infonavit', 'Bancario'],
        rentTerms: {
          depositMonths: '1',
          guarantorRequired: true,
          incomeProof: true,
          petsAllowed: false,
          includedUtilities: 'Ninguno',
          minContractMonths: '12'
        },
        ownerName: '',
        ownerPhone: '',
        ownerEmail: '',
        privateNotes: '',
        adminComments: '',
        photos: []
      });

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (targetRole === 'admin') {
          if (loginUser === 'admin' && loginPass === 'admin123') {
            setAuthMode('admin');
            setShowLoginModal(false);
            setLoginUser(''); setLoginPass('');
          } else {
            alert('Usuario o contraseña de Administrador incorrectos.');
          }
        } else if (targetRole === 'vendor') {
          if (loginUser === 'vendedor' && loginPass === 'vendedor123') {
            setAuthMode('vendor');
            setShowLoginModal(false);
            setLoginUser(''); setLoginPass('');
          } else {
            alert('Usuario o contraseña de Vendedor incorrectos.');
          }
        }
      };

      const handlePhotoUpload = (e) => {
        const files = Array.from(e.target.files);
        if (formData.photos.length + files.length > 10) {
          alert('Máximo 10 fotos por vivienda.');
          return;
        }

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const scale = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scale;

              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

              setFormData(prev => ({
                ...prev,
                photos: [...prev.photos, compressedBase64].slice(0, 10)
              }));
            };
          };
          reader.readAsDataURL(file);
        });
      };

      const handleSaveProperty = (e) => {
        e.preventDefault();
        if (formData.photos.length === 0) {
          alert('Por favor agrega al menos una foto.');
          return;
        }

        const propData = {
          ...formData,
          id: editingProperty ? editingProperty.id : (`ZEN-${Date.now()}`),
          controlNumber: formData.controlNumber || `ZEN-${Date.now()}`,
          price: Number(formData.price),
          landArea: Number(formData.landArea),
          builtArea: Number(formData.builtArea),
          roomsCount: Number(formData.roomsCount),
          roomDetails: typeof formData.roomDetails === 'string' 
            ? formData.roomDetails.split('\n').filter(l => l.trim() !== '') 
            : formData.roomDetails
        };

        if (editingProperty) {
          setProperties(properties.map(p => p.id === editingProperty.id ? propData : p));
          alert('Inmueble actualizado correctamente');
        } else {
          setProperties([propData, ...properties]);
          alert('Inmueble dado de alta correctamente');
        }

        closeModalForm();
      };

      // Alternar estado activo / inactivo directamente desde la tarjeta (Admin)
      const togglePropertyStatus = (id) => {
        setProperties(properties.map(p => {
          if (p.id === id) {
            const newStatus = p.status === 'inactive' ? 'active' : 'inactive';
            return { ...p, status: newStatus };
          }
          return p;
        }));
      };

      // Eliminar propiedad (Admin)
      const deleteProperty = (prop) => {
        if (confirm(`¿Estás seguro de que deseas eliminar permanentemente la propiedad con Control #${prop.controlNumber}?`)) {
          setProperties(properties.filter(p => p.id !== prop.id));
          if (selectedProperty && selectedProperty.id === prop.id) {
            setSelectedProperty(null);
            window.location.hash = '';
          }
          alert('Propiedad eliminada con éxito.');
        }
      };

      const openEditModal = (prop) => {
        setEditingProperty(prop);
        setFormData({
          ...prop,
          status: prop.status || 'active',
          roomDetails: Array.isArray(prop.roomDetails) ? prop.roomDetails.join('\n') : prop.roomDetails,
          rentTerms: prop.rentTerms || { depositMonths: '1', guarantorRequired: true, incomeProof: true, petsAllowed: false, includedUtilities: '', minContractMonths: '12' }
        });
        setShowNewModal(true);
      };

      const closeModalForm = () => {
        setShowNewModal(false);
        setEditingProperty(null);
        setFormData({
          controlNumber: '',
          title: '',
          type: 'venta',
          status: 'active',
          price: '',
          city: 'San Luis Río Colorado',
          colonia: '',
          landArea: '',
          builtArea: '',
          roomsCount: '',
          roomDetails: '',
          infonavit: true,
          credits: ['Infonavit', 'Bancario'],
          rentTerms: { depositMonths: '1', guarantorRequired: true, incomeProof: true, petsAllowed: false, includedUtilities: 'Ninguno', minContractMonths: '12' },
          ownerName: '',
          ownerPhone: '',
          ownerEmail: '',
          privateNotes: '',
          adminComments: '',
          photos: []
        });
      };

      const copyImageToClipboard = async (photoSrc) => {
        try {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = photoSrc;
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            canvas.toBlob(async (blob) => {
              if (blob) {
                await navigator.clipboard.write([
                  new ClipboardItem({ [blob.type]: blob })
                ]);
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 3000);
              }
            }, 'image/png');
          };
        } catch (err) {
          alert('Foto lista para compartir. Usa la opción "Ver Fotos" desde el link compartido.');
        }
      };

      const sendWhatsApp = (prop) => {
        const isRenta = prop.type === 'renta';
        const baseUrl = window.location.href.split('#')[0];
        const directLink = `${baseUrl}#/inmueble/${prop.controlNumber}`;

        let message = `*Zentai Servicios Inmobiliarios*\n\n` +
          `*Ficha de ${isRenta ? 'Renta' : 'Venta'} - Control #${prop.controlNumber}*\n` +
          `*Título:* ${prop.title}\n` +
          `*Ubicación:* ${prop.colonia}, ${prop.city}\n` +
          `*Precio:* $${prop.price?.toLocaleString('es-MX')} MXN${isRenta ? ' / mes' : ''}\n` +
          `*Terreno:* ${prop.landArea} m² | *Construcción:* ${prop.builtArea} m²\n` +
          `*Habitaciones:* ${prop.roomsCount}\n`;

        if (isRenta && prop.rentTerms) {
          message += `*Depósito:* ${prop.rentTerms.depositMonths} mes(es)\n` +
                     `*Aval Requerido:* ${prop.rentTerms.guarantorRequired ? 'Sí' : 'No'}\n` +
                     `*Mascotas:* ${prop.rentTerms.petsAllowed ? 'Permitidas' : 'No permitidas'}\n`;
        } else {
          message += `*Infonavit:* ${prop.infonavit ? 'Sí' : 'No'}\n` +
                     `*Créditos:* ${prop.credits?.join(', ') || 'N/A'}\n`;
        }

        message += `\n*Distribución:*\n` +
          (prop.roomDetails || []).map(d => `• ${d}`).join('\n') + `\n\n` +
          `📸 *Ver Galería de Fotos y Detalles Directos:* ${directLink}`;

        const encoded = encodeURIComponent(message);
        window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
      };

      const citiesList = [...new Set(properties.map(p => p.city).filter(Boolean))];
      const coloniasList = [...new Set(properties.map(p => p.colonia).filter(Boolean))];

      const filtered = properties.filter(p => {
        // Si no es admin, ocultar las inactivas
        if (authMode !== 'admin' && p.status === 'inactive') return false;

        const matchTab = (p.type || 'venta') === activeTab;
        const matchSearch = p.title.toLowerCase().includes(filterSearch.toLowerCase()) || 
                            p.controlNumber.toLowerCase().includes(filterSearch.toLowerCase());
        const matchCity = filterCity === 'all' || p.city === filterCity;
        const matchColonia = filterColonia === 'all' || p.colonia === filterColonia;
        const matchInfonavit = filterInfonavit === 'all' ? true : 
                               filterInfonavit === 'yes' ? p.infonavit : !p.infonavit;
        return matchTab && matchSearch && matchCity && matchColonia && (activeTab === 'renta' || matchInfonavit);
      });

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-zentai-blue text-white shadow-lg sticky top-0 z-40 border-b-2 border-zentai-gold">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
              
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setAuthMode('public'); window.location.hash = ''; setSelectedProperty(null); }}>
                <div className="w-12 h-12 bg-white rounded-full p-1 shadow-md flex items-center justify-center border-2 border-zentai-gold">
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain">
                    <circle cx="250" cy="250" r="230" fill="none" stroke="#9E9275" strokeWidth="12" />
                    <g transform="translate(140, 110) scale(0.6)">
                      <rect x="50" y="50" width="200" height="200" fill="none" stroke="#9E9275" strokeWidth="16"/>
                      <rect x="80" y="80" width="200" height="200" fill="none" stroke="#9E9275" strokeWidth="16"/>
                      <rect x="110" y="110" width="200" height="200" fill="none" stroke="#9E9275" strokeWidth="16"/>
                      <polygon points="110,210 210,110 210,210" fill="#9E9275"/>
                    </g>
                    <text x="250" y="375" textAnchor="middle" fill="#1D3D4E" fontSize="42" fontWeight="900" fontFamily="sans-serif" letterSpacing="4">ZENTAI</text>
                    <text x="250" y="415" textAnchor="middle" fill="#1D3D4E" fontSize="16" fontWeight="600" fontFamily="sans-serif" letterSpacing="3">SERVICIOS INMOBILIARIOS</text>
                  </svg>
                </div>
                <div>
                  <h1 className="text-lg font-extrabold tracking-wider text-white">ZENTAI INMOBILIARIA</h1>
                  <p className="text-[10px] text-zentai-gold tracking-widest uppercase font-semibold">Catálogo Inmobiliario Profesional</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {authMode === 'public' ? (
                  <div className="flex bg-zentai-dark rounded-lg p-1 border border-zentai-gold/40 text-xs">
                    <button
                      onClick={() => { setTargetRole('vendor'); setShowLoginModal(true); }}
                      className="px-3 py-1.5 text-gray-200 hover:text-white font-semibold rounded transition"
                    >
                      <i className="fa-solid fa-user-tag mr-1 text-zentai-gold"></i> Login Vendedor
                    </button>
                    <button
                      onClick={() => { setTargetRole('admin'); setShowLoginModal(true); }}
                      className="px-3 py-1.5 bg-zentai-gold text-white font-semibold rounded shadow transition"
                    >
                      <i className="fa-solid fa-user-shield mr-1"></i> Login Admin
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-3 bg-zentai-dark px-3 py-1.5 rounded-lg border border-zentai-gold/50 text-xs">
                    <span className="text-amber-400 font-bold uppercase flex items-center gap-1">
                      <i className={`fa-solid ${authMode === 'admin' ? 'fa-user-shield' : 'fa-user-tag'}`}></i>
                      Modo {authMode}
                    </span>
                    <button
                      onClick={() => setAuthMode('public')}
                      className="bg-red-600/80 hover:bg-red-700 text-white px-2.5 py-1 rounded font-semibold transition"
                    >
                      Cerrar Sesión
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {authMode === 'admin' && (
            <div className="bg-amber-50 border-b border-amber-200 py-2.5 shadow-inner">
              <div className="max-w-7xl mx-auto px-4 flex justify-between items-center text-xs">
                <span className="text-amber-900 font-bold flex items-center gap-1.5">
                  <i className="fa-solid fa-triangle-exclamation text-amber-600"></i> Modo Administrador: Puedes eliminar, ocultar/activar y editar cualquier inmueble.
                </span>
                <button
                  onClick={() => { setEditingProperty(null); setShowNewModal(true); }}
                  className="bg-zentai-gold hover:bg-zentai-gold-light text-white font-bold px-3 py-1.5 rounded shadow flex items-center gap-1.5 transition"
                >
                  <i className="fa-solid fa-plus"></i> Dar de Alta Inmueble
                </button>
              </div>
            </div>
          )}

          <div className="bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 flex justify-center space-x-8">
              <button
                onClick={() => setActiveTab('venta')}
                className={`py-3 px-6 font-bold text-sm border-b-2 transition flex items-center gap-2 ${activeTab === 'venta' ? 'border-zentai-blue text-zentai-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}`}
              >
                <i className="fa-solid fa-house"></i> Casas y Bienes en Venta
              </button>
              <button
                onClick={() => setActiveTab('renta')}
                className={`py-3 px-6 font-bold text-sm border-b-2 transition flex items-center gap-2 ${activeTab === 'renta' ? 'border-zentai-gold text-zentai-gold' : 'border-transparent text-slate-400 hover:text-slate-600'}`}
              >
                <i className="fa-solid fa-key"></i> Casas y Departamentos en Renta
              </button>
            </div>
          </div>

          <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-center">
              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder="Buscar título o # control..."
                  value={filterSearch}
                  onChange={(e) => setFilterSearch(e.target.value)}
                  className="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-1 focus:ring-zentai-gold"
                />
              </div>

              <div>
                <select
                  value={filterCity}
                  onChange={(e) => setFilterCity(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg text-xs px-3 py-2 bg-white"
                >
                  <option value="all">Todas las Ciudades</option>
                  {citiesList.map((c, i) => <option key={i} value={c}>{c}</option>)}
                </select>
              </div>

              <div>
                <select
                  value={filterColonia}
                  onChange={(e) => setFilterColonia(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg text-xs px-3 py-2 bg-white"
                >
                  <option value="all">Todas las Colonias</option>
                  {coloniasList.map((col, i) => <option key={i} value={col}>{col}</option>)}
                </select>
              </div>

              {activeTab === 'venta' && (
                <div>
                  <select
                    value={filterInfonavit}
                    onChange={(e) => setFilterInfonavit(e.target.value)}
                    className="w-full border border-slate-300 rounded-lg text-xs px-3 py-2 bg-white"
                  >
                    <option value="all">Infonavit (Todos)</option>
                    <option value="yes">Acepta Infonavit</option>
                    <option value="no">No aplica Infonavit</option>
                  </select>
                </div>
              )}
            </div>

            {filtered.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
                <i className="fa-solid fa-house-circle-xmark text-4xl text-slate-300 mb-2"></i>
                <p className="text-slate-600 font-semibold text-sm">No se encontraron inmuebles registrados para esta categoría o filtros.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map(prop => (
                  <div key={prop.id} className={`bg-white rounded-xl shadow-md border overflow-hidden flex flex-col hover:shadow-lg transition ${prop.status === 'inactive' ? 'border-red-300 bg-red-50/20 opacity-80' : 'border-slate-200'}`}>
                    
                    <div className="relative h-48 bg-slate-100 overflow-hidden group">
                      <img
                        src={prop.photos?.[0] || 'https://via.placeholder.com/600x400?text=Sin+Foto'}
                        alt={prop.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                      />
                      <div className="absolute top-2 left-2 bg-zentai-blue text-white text-xs font-bold px-2 py-1 rounded shadow">
                        #{prop.controlNumber}
                      </div>

                      <div className="absolute top-2 right-2 flex flex-col gap-1 items-end">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider shadow ${prop.type === 'renta' ? 'bg-amber-600 text-white' : 'bg-emerald-600 text-white'}`}>
                          {prop.type === 'renta' ? 'En Renta' : 'En Venta'}
                        </span>

                        {/* Indicador de Estado Inactivo (Sólo visible para Admin) */}
                        {prop.status === 'inactive' && (
                          <span className="bg-red-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider shadow">
                            <i className="fa-solid fa-eye-slash mr-1"></i> Oculto / Inactivo
                          </span>
                        )}
                      </div>

                      <div className="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm">
                        <i className="fa-solid fa-camera mr-1"></i> {prop.photos?.length || 0}/10
                      </div>
                    </div>

                    <div className="p-4 flex-grow flex flex-col justify-between">
                      <div>
                        <div className="text-[11px] font-semibold text-zentai-gold uppercase tracking-wider mb-1">
                          <i className="fa-solid fa-location-dot mr-1"></i> {prop.colonia}, {prop.city}
                        </div>
                        <h3 className="font-bold text-slate-800 text-base line-clamp-1">{prop.title}</h3>
                        <p className="text-xl font-extrabold text-zentai-blue mt-1">
                          ${prop.price?.toLocaleString('es-MX')} <span className="text-xs font-normal text-slate-500">MXN {prop.type === 'renta' ? '/ mes' : ''}</span>
                        </p>

                        <div className="grid grid-cols-3 gap-2 my-3 py-2 border-y border-slate-100 text-center text-xs">
                          <div>
                            <p className="text-slate-400">Terreno</p>
                            <p className="font-semibold text-slate-700">{prop.landArea} m²</p>
                          </div>
                          <div>
                            <p className="text-slate-400">Construcción</p>
                            <p className="font-semibold text-slate-700">{prop.builtArea} m²</p>
                          </div>
                          <div>
                            <p className="text-slate-400">Cuartos</p>
                            <p className="font-semibold text-slate-700">{prop.roomsCount}</p>
                          </div>
                        </div>

                        {prop.type === 'renta' && prop.rentTerms && (
                          <div className="bg-amber-50/70 p-2.5 rounded-lg border border-amber-200 text-[11px] mb-3 space-y-1">
                            <p className="font-bold text-amber-900"><i className="fa-solid fa-key text-amber-600 mr-1"></i> Requisitos de Renta:</p>
                            <p>• Depósito: <span className="font-semibold">{prop.rentTerms.depositMonths} mes(es)</span></p>
                            <p>• Aval/Fiador: <span className="font-semibold">{prop.rentTerms.guarantorRequired ? 'Requerido' : 'No necesario'}</span></p>
                          </div>
                        )}

                        {/* PANEL DE CONTROL DE ADMINISTRADOR PARA EDITAR, ACTIVAR/OCULTAR Y BORRAR */}
                        {authMode === 'admin' && (
                          <div className="mt-3 bg-slate-100 p-3 rounded-lg border border-slate-300 text-xs space-y-2">
                            <div className="flex items-center justify-between border-b border-slate-200 pb-1.5">
                              <span className="font-bold text-slate-800"><i className="fa-solid fa-sliders text-amber-600 mr-1"></i> Control Admin</span>
                              
                              <div className="flex gap-1.5">
                                <button
                                  onClick={() => togglePropertyStatus(prop.id)}
                                  className={`text-[10px] font-bold px-2 py-0.5 rounded transition ${prop.status === 'inactive' ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-slate-700 hover:bg-slate-800 text-white'}`}
                                  title={prop.status === 'inactive' ? 'Hacer visible al público' : 'Ocultar al público'}
                                >
                                  <i className={`fa-solid ${prop.status === 'inactive' ? 'fa-eye' : 'fa-eye-slash'} mr-1`}></i>
                                  {prop.status === 'inactive' ? 'Activar' : 'Ocultar'}
                                </button>

                                <button onClick={() => openEditModal(prop)} className="text-[10px] bg-zentai-blue text-white px-2 py-0.5 rounded hover:bg-zentai-dark">
                                  <i className="fa-solid fa-pen"></i> Editar
                                </button>

                                <button onClick={() => deleteProperty(prop)} className="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded hover:bg-red-700" title="Eliminar propiedad">
                                  <i className="fa-solid fa-trash"></i>
                                </button>
                              </div>
                            </div>

                            <p><span className="font-semibold">Propietario:</span> {prop.ownerName || 'N/A'} ({prop.ownerPhone || 'Sin teléfono'})</p>

                            {prop.adminComments && (
                              <div className="text-amber-900 bg-amber-100/60 p-1.5 rounded text-[11px] italic">
                                "{prop.adminComments}"
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                        <button
                          onClick={() => { 
                            setSelectedProperty(prop); 
                            setActivePhotoIdx(0); 
                            window.location.hash = `#/inmueble/${prop.controlNumber}`;
                          }}
                          className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-lg transition"
                        >
                          Ver Detalles y Fotos
                        </button>

                        <button
                          onClick={() => sendWhatsApp(prop)}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5"
                        >
                          <i className="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                        </button>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal de Detalle */}
          {selectedProperty && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 overflow-y-auto backdrop-blur-sm">
              <div className="bg-white w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl my-8">
                <div className="bg-zentai-blue text-white p-4 flex justify-between items-center">
                  <div>
                    <span className="text-xs text-zentai-gold font-bold">CONTROL #{selectedProperty.controlNumber}</span>
                    <h2 className="text-lg font-bold">{selectedProperty.title}</h2>
                  </div>
                  <button onClick={() => { setSelectedProperty(null); window.location.hash = ''; }} className="text-slate-300 hover:text-white text-xl">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <div className="h-64 bg-slate-900 rounded-lg overflow-hidden relative mb-3 group">
                      <img
                        src={selectedProperty.photos?.[activePhotoIdx] || 'https://via.placeholder.com/600x400?text=Sin+Foto'}
                        alt="Foto amplia"
                        className="w-full h-full object-contain"
                      />
                      <div className="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded">
                        {activePhotoIdx + 1} de {selectedProperty.photos?.length || 0}
                      </div>

                      <button
                        onClick={() => copyImageToClipboard(selectedProperty.photos?.[activePhotoIdx])}
                        className="absolute bottom-2 right-2 bg-zentai-gold hover:bg-zentai-gold-light text-white text-[11px] font-bold px-2.5 py-1 rounded shadow flex items-center gap-1.5 transition"
                      >
                        <i className="fa-solid fa-copy"></i> Copiar Foto
                      </button>
                    </div>

                    {copySuccess && (
                      <div className="mb-2 p-2 bg-emerald-100 border border-emerald-300 text-emerald-800 text-[11px] rounded text-center font-bold">
                        ¡Foto copiada al portapapeles! Abre WhatsApp y presiona Ctrl + V para pegarla.
                      </div>
                    )}

                    <div className="flex gap-2 overflow-x-auto pb-2">
                      {selectedProperty.photos?.map((ph, idx) => (
                        <button
                          key={idx}
                          onClick={() => setActivePhotoIdx(idx)}
                          className={`w-16 h-12 flex-shrink-0 rounded overflow-hidden border-2 transition ${activePhotoIdx === idx ? 'border-zentai-gold scale-105' : 'border-transparent opacity-60'}`}
                        >
                          <img src={ph} className="w-full h-full object-cover" />
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-col justify-between text-xs">
                    <div>
                      <p className="text-2xl font-extrabold text-zentai-blue mb-1">
                        ${selectedProperty.price?.toLocaleString('es-MX')} MXN {selectedProperty.type === 'renta' ? '/ mes' : ''}
                      </p>
                      <p className="text-slate-500 font-semibold mb-3">
                        <i className="fa-solid fa-location-dot text-zentai-gold mr-1"></i> {selectedProperty.colonia}, {selectedProperty.city}
                      </p>

                      <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-lg text-center mb-4">
                        <div>
                          <p className="text-slate-400">Terreno</p>
                          <p className="font-bold">{selectedProperty.landArea} m²</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Construcción</p>
                          <p className="font-bold">{selectedProperty.builtArea} m²</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Cuartos</p>
                          <p className="font-bold">{selectedProperty.roomsCount}</p>
                        </div>
                      </div>

                      <div className="mb-4">
                        <h4 className="font-bold uppercase text-slate-400 tracking-wider mb-2">Distribución de Cuartos / Áreas:</h4>
                        <ul className="space-y-1.5 max-h-32 overflow-y-auto pr-2">
                          {(selectedProperty.roomDetails || []).map((detail, idx) => (
                            <li key={idx} className="flex items-start gap-2">
                              <i className="fa-solid fa-check text-zentai-gold mt-0.5"></i>
                              <span>{detail}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {selectedProperty.type === 'renta' && selectedProperty.rentTerms && (
                        <div className="bg-amber-50 p-3 rounded-lg border border-amber-200 mb-4 space-y-1">
                          <p className="font-bold text-amber-900"><i className="fa-solid fa-key mr-1"></i> Información y Requisitos de Arrendamiento:</p>
                          <p>• Meses de depósito: {selectedProperty.rentTerms.depositMonths}</p>
                          <p>• Aval con propiedad: {selectedProperty.rentTerms.guarantorRequired ? 'Sí' : 'No'}</p>
                          <p>• Comprobante de ingresos: {selectedProperty.rentTerms.incomeProof ? 'Requerido' : 'No'}</p>
                          <p>• Se aceptan mascotas: {selectedProperty.rentTerms.petsAllowed ? 'Sí' : 'No'}</p>
                          <p>• Contrato mínimo: {selectedProperty.rentTerms.minContractMonths} meses</p>
                        </div>
                      )}

                      {selectedProperty.type === 'venta' && (
                        <div className="mb-4">
                          <p className="mb-1">
                            <span className="font-semibold">Infonavit:</span> {selectedProperty.infonavit ? '✅ Aplica para crédito Infonavit' : '❌ No aplica para Infonavit'}
                          </p>
                          <p className="text-slate-600">
                            <span className="font-semibold">Créditos admisibles:</span> {selectedProperty.credits?.join(', ')}
                          </p>
                        </div>
                      )}

                      {authMode === 'admin' && selectedProperty.adminComments && (
                        <div className="bg-amber-100/80 p-3 rounded-lg border border-amber-300 text-amber-900">
                          <p className="font-bold mb-1"><i className="fa-solid fa-comment-dots mr-1"></i> Comentarios Internos del Administrador:</p>
                          <p className="italic">{selectedProperty.adminComments}</p>
                        </div>
                      )}
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex gap-2">
                      <button
                        onClick={() => sendWhatsApp(selectedProperty)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2"
                      >
                        <i className="fa-brands fa-whatsapp text-base"></i> Enviar Ficha por WhatsApp
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal de Login */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl p-6">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-base text-zentai-blue">
                    Acceso como {targetRole === 'admin' ? 'Administrador' : 'Vendedor'}
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <form onSubmit={handleLoginSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Usuario</label>
                    <input
                      type="text"
                      required
                      placeholder={targetRole === 'admin' ? 'admin' : 'vendedor'}
                      value={loginUser}
                      onChange={e => setLoginUser(e.target.value)}
                      className="w-full mt-1 p-2 border rounded"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Contraseña</label>
                    <input
                      type="password"
                      required
                      placeholder="********"
                      value={loginPass}
                      onChange={e => setLoginPass(e.target.value)}
                      className="w-full mt-1 p-2 border rounded"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-zentai-gold hover:bg-zentai-gold-light text-white font-bold rounded shadow mt-2"
                  >
                    Ingresar al Sistema
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Alta / Edición de Inmueble */}
          {showNewModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl my-8">
                <div className="bg-zentai-blue text-white p-4 flex justify-between items-center">
                  <h2 className="font-bold text-base flex items-center gap-2">
                    <i className="fa-solid fa-house-medical text-zentai-gold"></i> {editingProperty ? 'Editar Inmueble' : 'Alta de Nuevo Inmueble'}
                  </h2>
                  <button onClick={closeModalForm} className="text-slate-300 hover:text-white">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveProperty} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                      <label className="font-bold text-slate-700">Operación *</label>
                      <select
                        value={formData.type}
                        onChange={e => setFormData({...formData, type: e.target.value})}
                        className="w-full mt-1 p-2 border rounded bg-white"
                      >
                        <option value="venta">Venta</option>
                        <option value="renta">Renta</option>
                      </select>
                    </div>

                    {/* SELECTOR DE ESTATUS VISIBLE / OCULTO */}
                    <div>
                      <label className="font-bold text-slate-700">Estatus Publicación *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({...formData, status: e.target.value})}
                        className="w-full mt-1 p-2 border rounded bg-white font-bold"
                      >
                        <option value="active">🟢 Activo (Publicado)</option>
                        <option value="inactive">🔴 Inactivo (Oculto)</option>
                      </select>
                    </div>

                    <div>
                      <label className="font-bold text-slate-700"># Control *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej. ZEN-2026-003"
                        value={formData.controlNumber}
                        onChange={e => setFormData({...formData, controlNumber: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Precio ($ MXN) *</label>
                      <input
                        type="number"
                        required
                        placeholder="2500000"
                        value={formData.price}
                        onChange={e => setFormData({...formData, price: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Título / Nombre Descriptivo *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej. Casa Residencial con Alberca"
                      value={formData.title}
                      onChange={e => setFormData({...formData, title: e.target.value})}
                      className="w-full mt-1 p-2 border rounded"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700">Ciudad *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej. San Luis Río Colorado"
                        value={formData.city}
                        onChange={e => setFormData({...formData, city: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Colonia *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej. Burócratas / Comercial"
                        value={formData.colonia}
                        onChange={e => setFormData({...formData, colonia: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="font-bold text-slate-700">M² Terreno *</label>
                      <input
                        type="number"
                        required
                        placeholder="200"
                        value={formData.landArea}
                        onChange={e => setFormData({...formData, landArea: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">M² Construidos *</label>
                      <input
                        type="number"
                        required
                        placeholder="150"
                        value={formData.builtArea}
                        onChange={e => setFormData({...formData, builtArea: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Cant. Cuartos *</label>
                      <input
                        type="number"
                        required
                        placeholder="4"
                        value={formData.roomsCount}
                        onChange={e => setFormData({...formData, roomsCount: e.target.value})}
                        className="w-full mt-1 p-2 border rounded"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Especificación de Cada Cuarto (Un detalle por línea) *</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Recámara Principal con baño&#10;2 Recámaras secundarias&#10;Sala y Comedor"
                      value={formData.roomDetails}
                      onChange={e => setFormData({...formData, roomDetails: e.target.value})}
                      className="w-full mt-1 p-2 border rounded"
                    ></textarea>
                  </div>

                  {formData.type === 'renta' && (
                    <div className="bg-amber-50 p-3 rounded-lg border border-amber-300 space-y-2">
                      <p className="font-bold text-amber-900"><i className="fa-solid fa-key mr-1"></i> Requisitos de Arrendamiento (Renta):</p>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <div>
                          <label className="text-[11px] font-bold">Meses Depósito</label>
                          <input type="text" value={formData.rentTerms.depositMonths} onChange={e => setFormData({...formData, rentTerms: {...formData.rentTerms, depositMonths: e.target.value}})} className="w-full p-1.5 border rounded" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold">Contrato Mínimo</label>
                          <input type="text" value={formData.rentTerms.minContractMonths} onChange={e => setFormData({...formData, rentTerms: {...formData.rentTerms, minContractMonths: e.target.value}})} className="w-full p-1.5 border rounded" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold">Servicios Incluidos</label>
                          <input type="text" value={formData.rentTerms.includedUtilities} onChange={e => setFormData({...formData, rentTerms: {...formData.rentTerms, includedUtilities: e.target.value}})} className="w-full p-1.5 border rounded" />
                        </div>
                        <div className="flex flex-col justify-around pt-2">
                          <label className="flex items-center space-x-1 font-semibold cursor-pointer">
                            <input type="checkbox" checked={formData.rentTerms.guarantorRequired} onChange={e => setFormData({...formData, rentTerms: {...formData.rentTerms, guarantorRequired: e.target.checked}})} />
                            <span>Aval requerido</span>
                          </label>
                          <label className="flex items-center space-x-1 font-semibold cursor-pointer">
                            <input type="checkbox" checked={formData.rentTerms.petsAllowed} onChange={e => setFormData({...formData, rentTerms: {...formData.rentTerms, petsAllowed: e.target.checked}})} />
                            <span>Mascotas OK</span>
                          </label>
                        </div>
                      </div>
                    </div>
                  )}

                  {formData.type === 'venta' && (
                    <div className="bg-slate-50 p-3 rounded border">
                      <label className="flex items-center space-x-2 font-bold text-slate-700 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={formData.infonavit}
                          onChange={e => setFormData({...formData, infonavit: e.target.checked})}
                          className="rounded text-zentai-gold focus:ring-zentai-gold"
                        />
                        <span>¿Pasa para crédito Infonavit?</span>
                      </label>
                    </div>
                  )}

                  <div className="bg-amber-100/60 p-3 rounded-lg border border-amber-300">
                    <label className="font-bold text-amber-900 block mb-1">
                      <i className="fa-solid fa-comment-dots mr-1"></i> Comentario / Bitácora Interna (Sólo visible para Administrador)
                    </label>
                    <textarea
                      rows="2"
                      placeholder="Observaciones de escrituras, comisiones, notas del dueño..."
                      value={formData.adminComments}
                      onChange={e => setFormData({...formData, adminComments: e.target.value})}
                      className="w-full p-2 border rounded bg-white"
                    ></textarea>
                  </div>

                  <div className="border border-slate-300 bg-slate-50 p-3 rounded-lg space-y-2">
                    <p className="font-bold text-slate-800 flex items-center">
                      <i className="fa-solid fa-user-lock mr-1.5 text-amber-600"></i> Datos del Propietario (Privado)
                    </p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                      <input
                        type="text"
                        placeholder="Nombre Completo"
                        value={formData.ownerName}
                        onChange={e => setFormData({...formData, ownerName: e.target.value})}
                        className="p-2 border rounded bg-white"
                      />
                      <input
                        type="text"
                        placeholder="Teléfono"
                        value={formData.ownerPhone}
                        onChange={e => setFormData({...formData, ownerPhone: e.target.value})}
                        className="p-2 border rounded bg-white"
                      />
                      <input
                        type="email"
                        placeholder="Correo"
                        value={formData.ownerEmail}
                        onChange={e => setFormData({...formData, ownerEmail: e.target.value})}
                        className="p-2 border rounded bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">
                      Fotos del Inmueble (Hasta 10 fotos) *
                    </label>
                    <input
                      type="file"
                      multiple
                      accept="image/*"
                      onChange={handlePhotoUpload}
                      disabled={formData.photos.length >= 10}
                      className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-zentai-blue file:text-white hover:file:bg-zentai-dark"
                    />
                    <div className="grid grid-cols-5 gap-2 mt-3">
                      {formData.photos.map((ph, idx) => (
                        <div key={idx} className="relative h-16 rounded overflow-hidden border">
                          <img src={ph} className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setFormData({...formData, photos: formData.photos.filter((_, i) => i !== idx)})}
                            className="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 text-[10px] flex items-center justify-center"
                          >
                            ×
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-3 border-t flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={closeModalForm}
                      className="px-4 py-2 border rounded text-slate-600 font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-zentai-gold hover:bg-zentai-gold-light text-white font-bold rounded shadow"
                    >
                      {editingProperty ? 'Guardar Cambios' : 'Registrar Inmueble'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-zentai-dark text-slate-400 text-xs py-6 mt-12 border-t border-zentai-gold/20">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
              <p className="font-semibold text-slate-300">ZENTAI SERVICIOS INMOBILIARIOS</p>
              <p className="text-[11px] text-slate-500">
                Sistema Inmobiliario Profesional
              </p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
